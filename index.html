<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breaking Benjamin Official </title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =====================
   GLOBAL
===================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:"Montserrat",sans-serif;
  overflow-x:hidden;
}

html{
  scroll-behavior:smooth;
}

section{
  position:relative;
  padding:140px 40px;
}

/* Elegant Divider Line Between Sections */
section::after{
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  height:1px;
  background:linear-gradient(to right,transparent,#ff0000,transparent);
  opacity:.5;
}

/* =====================
   SIDEBAR
===================== */

.navbar{
  position:fixed;
  left:0;
  top:0;
  height:100%;
  width:70px;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(6px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:40px;
  transition:width .4s ease;
  z-index:999;
}

.navbar:hover,
.navbar.active{
  width:220px;
}

.logo{
  font-family:"Oswald",sans-serif;
  letter-spacing:4px;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  margin-bottom:60px;
}

.nav-links{
  display:flex;
  flex-direction:column;
  gap:25px;
  width:100%;
  padding:0 10px;
}

.nav-links a{
  color:#ccc;
  font-weight:600;
  padding:12px;
  border-radius:6px;
  transition:.3s;
}

.nav-links a:hover,
.nav-links a.active-link{
  background:#ff0000;
  color:#000;
}

/* =====================
   HERO
===================== */

.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(to bottom,#000,#111);
}

.hero h1{
  font-family:"Oswald",sans-serif;
  font-size:5rem;
  letter-spacing:10px;
  margin-bottom:30px;
}

.hero p{
  font-size:1.3rem;
  margin-bottom:40px;
  opacity:.8;
}

/* BIG RED PRIMARY BUTTONS */
.btn-primary{
  padding:22px 70px;
  font-size:1.1rem;
  font-weight:700;
  border:none;
  border-radius:6px;
  background:#ff0000;
  color:#fff;
  cursor:pointer;
  transition:.3s;
  margin:10px;
}

.btn-primary:hover{
  background:#fff;
  color:#000;
  transform:scale(1.05);
}

/* =====================
   STORE GRID
===================== */

.section-title{
  font-family:"Oswald",sans-serif;
  font-size:3rem;
  letter-spacing:6px;
  text-align:center;
  margin-bottom:70px;
}

.merch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:40px;
  max-width:1200px;
  margin:auto;
}

.merch-card{
  background:#111;
  border-radius:8px;
  overflow:hidden;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.merch-card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(255,0,0,.15);
}

.merch-card img{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
}

.merch-content{
  padding:20px;
  text-align:center;
}

.price{
  font-weight:700;
  margin:10px 0;
}

/* UNIQUE BUY BUTTON STYLE */
.btn-buy{
  padding:14px 20px;
  border:2px solid #ff0000;
  background:transparent;
  color:#ff0000;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  border-radius:4px;
}

.btn-buy:hover{
  background:#ff0000;
  color:#000;
}

/* =====================
   TOUR
===================== */

.tour-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
  max-width:1000px;
  margin:auto;
}

.tour-card{
  background:#111;
  padding:30px;
  border-radius:8px;
  transition:.3s;
}

.tour-card:hover{
  transform:translateY(-5px);
}

.tour-card p{
  margin-bottom:20px;
}

/* =====================
   RESPONSIVE
===================== */

@media(max-width:768px){
  .navbar{
    flex-direction:row;
    height:auto;
    width:100%;
    padding:10px;
  }

  .logo{
    writing-mode:horizontal-tb;
    transform:none;
    margin:0;
  }

  .hero h1{
    font-size:2.8rem;
  }

  section{
    padding:100px 20px;
  }
}

</style>
</head>

<body>

<nav class="navbar" id="sidebar">
  <div class="logo">Breaking Benjamin</div>
  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#store">Store</a>
    <a href="#tour">Tour</a>
  </div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
  <div>
    <h1>AWAKEN</h1>
    <p>Experience the energy. Feel the darkness.</p>
    <button class="btn-primary" onclick="document.getElementById('store').scrollIntoView()">Shop Merch</button>
  </div>
</section>

<!-- STORE -->
<section id="store">
  <h2 class="section-title">Breaking Benjamin Official Fan Store</h2>

  <div class="merch-grid">

    <div class="merch-card">
      <img src="https://images.unsplash.com/photo-1520975918318-6c3e2d6a1f3f" alt="Red Windbreaker">
      <div class="merch-content">
        <h3>Shatter Red Windbreaker</h3>
        <div class="price">$95.00</div>
        <button class="btn-buy">Buy Now</button>
      </div>
    </div>

    <div class="merch-card">
      <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad" alt="Black Pullover">
      <div class="merch-content">
        <h3>Logo Black Pullover</h3>
        <div class="price">$95.00</div>
        <button class="btn-buy">Buy Now</button>
      </div>
    </div>

    <div class="merch-card">
      <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf" alt="Grey Sweatpants">
      <div class="merch-content">
        <h3>Phantom Grey Sweatpants</h3>
        <div class="price">$80.00</div>
        <button class="btn-buy">Buy Now</button>
      </div>
    </div>

  </div>
</section>

<!-- TOUR -->
<section id="tour">
  <h2 class="section-title">Tour Dates</h2>

  <div class="tour-grid">
    <div class="tour-card">
      <p>May 9, 2026<br>Daytona Beach, FL</p>
      <button class="btn-primary">Get Tickets</button>
    </div>

    <div class="tour-card">
      <p>May 14–17, 2026<br>Columbus, OH</p>
      <button class="btn-primary">Get Tickets</button>
    </div>
  </div>
</section>
