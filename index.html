<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Breaking Benjamin Tribute Experience</title>
<meta name="description" content="A cinematic tribute experience inspired by professional band websites. Featuring merch, tour dates, and interactive animations.">

<!-- Open Graph -->
<meta property="og:title" content="Breaking Benjamin Tribute Experience">
<meta property="og:description" content="Interactive band-style experience with merch and tour integration.">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

/* ================= GLOBAL ================= */

:root{
  --primary:#ff0000;
  --dark:#000;
  --card:#111;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--dark);
  color:white;
  font-family:"Montserrat",sans-serif;
  overflow-x:hidden;
}

h1,h2,h3{
  font-family:"Oswald",sans-serif;
  letter-spacing:3px;
}

section{
  padding:120px 40px;
  position:relative;
}

section::after{
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  height:1px;
  background:linear-gradient(to right,transparent,var(--primary),transparent);
  opacity:.4;
}

/* ================= NAV ================= */

header{
  position:fixed;
  width:100%;
  top:0;
  left:0;
  padding:20px 40px;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  transition:.3s;
}

header.shrink{
  padding:10px 40px;
  background:#000;
}

nav a{
  color:#ccc;
  margin-left:25px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

nav a:hover,
nav a.active{
  color:var(--primary);
}

/* ================= HERO ================= */

.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(to bottom,#000,#111);
}

.hero h1{
  font-size:4.5rem;
}

.hero-buttons{
  margin-top:40px;
}

.btn-primary{
  background:var(--primary);
  border:none;
  padding:18px 60px;
  font-weight:700;
  cursor:pointer;
  margin:10px;
  transition:.3s;
}

.btn-primary:hover{
  background:#fff;
  color:#000;
}

/* ================= GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:var(--card);
  border-radius:8px;
  overflow:hidden;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.card-content{
  padding:20px;
  text-align:center;
}

.price{
  margin:10px 0;
  font-weight:700;
}

/* Buy Button Unique Style */
.btn-buy{
  border:2px solid var(--primary);
  background:transparent;
  color:var(--primary);
  padding:12px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
}

.btn-buy:hover{
  background:var(--primary);
  color:#000;
}

/* ================= CART ================= */

.cart-drawer{
  position:fixed;
  right:-400px;
  top:0;
  width:350px;
  height:100%;
  background:#111;
  padding:30px;
  transition:.4s;
  z-index:1000;
  overflow-y:auto;
}

.cart-drawer.active{
  right:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.cart-badge{
  background:var(--primary);
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){
  .hero h1{font-size:2.8rem;}
  section{padding:100px 20px;}
}

</style>
</head>

<body>

<header id="navbar">
  <h3>TRIBUTE</h3>
  <nav>
    <a href="#home">Home</a>
    <a href="#store">Store</a>
    <a href="#tour">Tour</a>
    <a href="#" onclick="toggleCart()">Cart <span id="cart-count" class="cart-badge">0</span></a>
  </nav>
</header>

<main>

<section id="home" class="hero">
  <div>
    <h1>AWAKEN</h1>
    <div class="hero-buttons">
      <button class="btn-primary" onclick="window.open('https://youtu.be/w0GfewGYR3g?si=lCk7T2Xqu2pDsIEw')">Listen Now</button>
      <button class="btn-primary" onclick="document.getElementById('store').scrollIntoView()">Shop Merch</button>
    </div>
  </div>
</section>

<section id="store">
  <h2 style="text-align:center;margin-bottom:60px;">Official Store</h2>
  <div id="product-grid" class="grid"></div>
</section>

<section id="tour">
  <h2 style="text-align:center;margin-bottom:60px;">Tour Dates</h2>
  <div id="tour-grid" class="grid"></div>
</section>

</main>

<!-- CART -->
<aside id="cart" class="cart-drawer" aria-label="Shopping cart">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <h3 id="cart-total">Total: $0</h3>
</aside>

<script>

/* ================= DATA ================= */

const products=[
  {id:1,name:"Red Windbreaker",price:95,img:"https://picsum.photos/400?1"},
  {id:2,name:"Black Pullover",price:95,img:"https://picsum.photos/400?2"},
  {id:3,name:"Grey Sweatpants",price:80,img:"https://picsum.photos/400?3"}
];

const tours=[
  {date:"May 9, 2026",location:"Daytona Beach, FL"},
  {date:"May 14–17, 2026",location:"Columbus, OH"}
];

/* ================= RENDER ================= */

const productGrid=document.getElementById("product-grid");
products.forEach(p=>{
  productGrid.innerHTML+=`
  <div class="card">
    <img src="${p.img}" alt="${p.name}">
    <div class="card-content">
      <h3>${p.name}</h3>
      <div class="price">$${p.price}</div>
      <button class="btn-buy" onclick="addToCart(${p.id})">Buy Now</button>
    </div>
  </div>`;
});

const tourGrid=document.getElementById("tour-grid");
tours.forEach(t=>{
  tourGrid.innerHTML+=`
  <div class="card">
    <div class="card-content">
      <h3>${t.date}</h3>
      <p>${t.location}</p>
      <button class="btn-primary">Tickets</button>
    </div>
  </div>`;
});

/* ================= CART ================= */

let cart=[];
function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function addToCart(id){
  const product=products.find(p=>p.id===id);
  cart.push(product);
  updateCart();
}

function updateCart(){
  const cartItems=document.getElementById("cart-items");
  cartItems.innerHTML="";
  let total=0;
  cart.forEach((item,i)=>{
    total+=item.price;
    cartItems.innerHTML+=`
      <div class="cart-item">
        <span>${item.name}</span>
        <span>$${item.price}</span>
      </div>`;
  });
  document.getElementById("cart-total").innerText="Total: $"+total;
  document.getElementById("cart-count").innerText=cart.length;
}

/* ================= GSAP ================= */

gsap.from(".hero h1",{y:100,opacity:0,duration:1.2});
gsap.utils.toArray(".card").forEach(card=>{
  gsap.from(card,{
    scrollTrigger:card,
    y:50,
    opacity:0,
    duration:.8
  });
});

/* Navbar shrink */
window.addEventListener("scroll",()=>{
  if(window.scrollY>50){
    document.getElementById("navbar").classList.add("shrink");
  }else{
    document.getElementById("navbar").classList.remove("shrink");
  }
});

</script>

</body>
</html>
