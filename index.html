<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Tribute Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; cursor:none; }
html { scroll-behavior:smooth; }
body { background:#000; color:#fff; font-family:"Montserrat",sans-serif; overflow-x:hidden; }

/* ===== INTRO LOADER ===== */
.loader {
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5000;
  transition:opacity 1s ease, visibility 1s;
}
.loader h1 {
  font-family:"Oswald",sans-serif;
  letter-spacing:8px;
  font-size:2rem;
  animation:pulse 1.5s infinite alternate;
}
@keyframes pulse {
  from { opacity:.4; }
  to { opacity:1; }
}
.loader.hide {
  opacity:0;
  visibility:hidden;
}

/* Scroll progress */
.scroll-progress {
  position:fixed;
  top:0; left:0;
  height:3px;
  width:0%;
  background:#fff;
  z-index:4000;
}

/* Cursor */
.cursor-glow {
  position:fixed;
  width:28px;
  height:28px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  backdrop-filter:blur(6px);
  z-index:4500;
  transition:transform .15s ease;
}

/* Navbar */
.navbar {
  position:fixed;
  width:100%;
  padding:30px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:3000;
  transition:all .4s cubic-bezier(.4,0,.2,1);
}
.navbar.shrink {
  padding:15px 80px;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
}
.logo {
  font-family:"Oswald",sans-serif;
  letter-spacing:6px;
}
.nav-links { display:flex; gap:50px; }
.nav-links a {
  color:#fff;
  text-decoration:none;
  letter-spacing:2px;
  position:relative;
}
.nav-links a::after {
  content:"";
  position:absolute;
  bottom:-4px;
  left:0;
  width:0%;
  height:1px;
  background:#fff;
  transition:.3s;
}
.nav-links a:hover::after { width:100%; }
.hamburger { display:none; font-size:1.8rem; }

/* Hero */
.hero {
  position:relative;
  height:100vh;
  overflow:hidden;
}
.hero video {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .4s ease, filter .4s ease;
}
.hero-overlay {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,.95));
}
.hero-content {
  position:relative;
  z-index:5;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.hero h1 span {
  display:inline-block;
  opacity:0;
  transform:translateY(60px);
}
.hero p { margin:25px 0 40px; letter-spacing:3px; }

/* Magnetic Buttons */
.btn {
  padding:16px 50px;
  border:2px solid #fff;
  background:transparent;
  color:#fff;
  letter-spacing:2px;
  position:relative;
  transition:.3s ease;
}
.btn:hover {
  background:#fff;
  color:#000;
}

/* Sections */
.section {
  padding:160px 20px;
  text-align:center;
}
.dark { background:#111; }
.darker { background:#0a0a0a; }
.section h2 {
  font-family:"Oswald",sans-serif;
  font-size:3rem;
  letter-spacing:6px;
  margin-bottom:40px;
  opacity:0;
  transform:translateY(60px);
  transition:1.2s ease;
}
.section.active h2 {
  opacity:1;
  transform:translateY(0);
}

/* Footer */
.footer {
  padding:60px;
  text-align:center;
  opacity:.5;
}

/* Responsive */
@media(max-width:768px){
  .navbar{ padding:20px; }
  .nav-links{
    position:absolute;
    top:70px;
    right:0;
    background:#000;
    flex-direction:column;
    width:100%;
    display:none;
    padding:30px 0;
  }
  .nav-links.active{ display:flex; }
  .hamburger{ display:block; }
  .hero h1{ font-size:2.5rem; }
  .section h2{ font-size:2rem; }
}
</style>
</head>
<body>

<div class="loader"><h1>ENTERING...</h1></div>
<div class="scroll-progress"></div>
<div class="cursor-glow"></div>

<nav class="navbar">
  <div class="logo">BAND NAME</div>
  <div class="nav-links">
    <a href="#home">Home</a>
    <a href="#tour">Tour</a>
    <a href="#merch">Merch</a>
  </div>
  <div class="hamburger">☰</div>
</nav>

<section id="home" class="hero">
  <video autoplay muted loop playsinline>
    <source src="hero-video.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 id="split-text">AWAKEN</h1>
    <p>The New Single Out Now</p>
    <button class="btn">Stream Now</button>
  </div>
</section>

<section id="tour" class="section dark">
  <h2>Tour Dates 2026</h2>
  <button class="btn">See All Dates</button>
</section>

<section id="merch" class="section darker">
  <h2>Official Merch</h2>
  <button class="btn">Shop Now</button>
</section>

<footer class="footer">© 2026 Tribute Experience</footer>

<script>
/* Loader */
window.addEventListener("load",()=>{
  setTimeout(()=>document.querySelector(".loader").classList.add("hide"),1500);
});

/* Split text animation */
const split = document.getElementById("split-text");
split.innerHTML = split.textContent.split("").map(l=>`<span>${l}</span>`).join("");
setTimeout(()=>{
  document.querySelectorAll("#split-text span").forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition="1s cubic-bezier(.2,.8,.2,1)";
      el.style.opacity=1;
      el.style.transform="translateY(0)";
    },i*80);
  });
},1800);

/* Scroll effects */
const navbar=document.querySelector(".navbar");
const progress=document.querySelector(".scroll-progress");
const video=document.querySelector("video");

window.addEventListener("scroll",()=>{
  const y=window.scrollY;
  const h=document.documentElement.scrollHeight-document.documentElement.clientHeight;
  progress.style.width=(y/h)*100+"%";

  if(y>60) navbar.classList.add("shrink");
  else navbar.classList.remove("shrink");

  video.style.transform=`scale(${1+y*0.00025})`;
  video.style.filter=`brightness(${1 - y*0.0003})`;
});

/* Cursor */
const cursor=document.querySelector(".cursor-glow");
document.addEventListener("mousemove",e=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* Section reveal */
const sections=document.querySelectorAll(".section");
const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting) entry.target.classList.add("active");
  });
},{threshold:.3});
sections.forEach(s=>observer.observe(s));

/* Mobile nav */
const hamburger=document.querySelector(".hamburger");
const navLinks=document.querySelector(".nav-links");
hamburger.addEventListener("click",()=>navLinks.classList.toggle("active"));
</script>

</body>
</html>
