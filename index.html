<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Breaking Benjamin Tribute Experience</title>
<meta name="description" content="Cinematic band-style tribute experience featuring merch, full tour dates, and interactive cart functionality.">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
:root{
  --primary:#ff0000;
  --dark:#000;
  --card:#111;
  --muted:#888;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  color:#fff;
  font-family:"Montserrat",sans-serif;
  overflow-x:hidden;
}

h1,h2,h3{
  font-family:"Oswald",sans-serif;
  letter-spacing:3px;
}

section{
  padding:120px 40px;
  position:relative;
}

section::after{
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:85%;
  height:1px;
  background:linear-gradient(to right,transparent,var(--primary),transparent);
  opacity:.3;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:-240px;
  top:0;
  width:240px;
  height:100%;
  background:#0a0a0a;
  padding:40px 20px;
  transition:.4s ease;
  z-index:1000;
}

.sidebar.active{
  left:0;
}

.sidebar h3{
  margin-bottom:40px;
}

.sidebar a{
  display:block;
  color:#ccc;
  margin-bottom:20px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
  color:var(--primary);
}

.toggle-btn{
  position:fixed;
  left:15px;
  top:20px;
  z-index:1100;
  background:var(--primary);
  border:none;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
}

/* HERO */

.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero iframe{
  position:absolute;
  top:50%;
  left:50%;
  width:120vw;
  height:120vh;
  transform:translate(-50%,-50%);
  pointer-events:auto;
}

.hero-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.65);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-overlay h1{
  font-size:4rem;
}

.btn-primary{
  background:var(--primary);
  padding:18px 60px;
  margin:15px;
  border:none;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.btn-primary:hover{
  background:#fff;
  color:#000;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:40px;
  max-width:1300px;
  margin:auto;
}

.card{
  background:#111;
  border-radius:8px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.card img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.card-content{
  padding:20px;
  text-align:center;
}

.price{
  margin:10px 0;
  font-weight:700;
}

.old-price{
  text-decoration:line-through;
  color:var(--muted);
  font-size:.9rem;
}

/* BUY BUTTON UNIQUE */

.btn-buy{
  border:2px solid var(--primary);
  background:transparent;
  color:var(--primary);
  padding:12px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
}

.btn-buy:hover{
  background:var(--primary);
  color:#000;
}

/* CART */

.cart{
  position:fixed;
  right:-400px;
  top:0;
  width:350px;
  height:100%;
  background:#111;
  padding:30px;
  transition:.4s;
  overflow-y:auto;
  z-index:1000;
}

.cart.active{
  right:0;
}

.cart-item{
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.qty-btn{
  background:var(--primary);
  border:none;
  padding:4px 8px;
  margin:0 4px;
  cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:768px){
  section{padding:100px 20px;}
  .hero-overlay h1{font-size:2.5rem;}
}

</style>
</head>
<body>

<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
  <h3>MENU</h3>
  <a href="#home">Home</a>
  <a href="#store">Store</a>
  <a href="#tour">Tour</a>
  <a href="#" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</a>
</div>

<section id="home" class="hero">
  <iframe src="https://www.youtube.com/embed/w0GfewGYR3g?autoplay=1&mute=1&controls=1&loop=1&playlist=w0GfewGYR3g" frameborder="0" allowfullscreen></iframe>
  <div class="hero-overlay">
    <h1>AWAKEN</h1>
    <button class="btn-primary" onclick="window.open('https://youtu.be/w0GfewGYR3g?si=lCk7T2Xqu2pDsIEw')">Listen on YouTube</button>
    <button class="btn-primary" onclick="document.getElementById('store').scrollIntoView()">New Merch</button>
  </div>
</section>

<section id="store">
  <h2 style="text-align:center;margin-bottom:60px;">Official Store</h2>
  <div id="product-grid" class="grid"></div>
</section>

<section id="tour">
  <h2 style="text-align:center;margin-bottom:60px;">Tour Dates</h2>
  <div id="tour-grid" class="grid"></div>
</section>

<div class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>
  <h3 id="cart-total">Total: $0</h3>
</div>

<script>

/* SIDEBAR */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
}

/* CART SYSTEM */
let cart=JSON.parse(localStorage.getItem("cart"))||[];

function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function updateCart(){
  const container=document.getElementById("cart-items");
  container.innerHTML="";
  let total=0;

  cart.forEach((item,index)=>{
    total+=item.price*item.qty;
    container.innerHTML+=`
      <div class="cart-item">
        <span>${item.name}</span>
        <div>
          <button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
          ${item.qty}
          <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
        </div>
      </div>`;
  });

  document.getElementById("cart-total").innerText="Total: $"+total;
  document.getElementById("cart-count").innerText=cart.length;
  localStorage.setItem("cart",JSON.stringify(cart));
}

function addToCart(name,price){
  const existing=cart.find(p=>p.name===name);
  if(existing){existing.qty++;}
  else{cart.push({name,price,qty:1});}
  updateCart();
}

function changeQty(index,delta){
  cart[index].qty+=delta;
  if(cart[index].qty<=0){cart.splice(index,1);}
  updateCart();
}

/* PRODUCTS */
const products=[
  {name:"Shatter Red Windbreaker",price:95,img:"https://images.unsplash.com/photo-1548883354-94bcfe321cbb"},
  {name:"Logo Chenille Black Pullover",price:95,img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf"},
  {name:"Logo Chenille Black Sweatpants",price:80,img:"https://images.unsplash.com/photo-1585386959984-a4155224a1ad"},
  {name:"Black Logo Hat",price:35,img:"https://images.unsplash.com/photo-1519741497674-611481863552"},
  {name:"3D Black Tee",price:40,img:"https://images.unsplash.com/photo-1520975918318-6c3e2d6a1f3f"}
];

const productGrid=document.getElementById("product-grid");

products.forEach(p=>{
  productGrid.innerHTML+=`
  <div class="card">
    <img src="${p.img}" alt="${p.name}">
    <div class="card-content">
      <h3>${p.name}</h3>
      <div class="price">$${p.price}</div>
      <button class="btn-buy" onclick="addToCart('${p.name}',${p.price})">Buy Now</button>
    </div>
  </div>`;
});

/* FULL TOUR DATES */
const tourDates = [
"May 9, 2026 - Daytona Beach, FL",
"May 14–17, 2026 - Columbus, OH",
"Jun 6, 2026 - Nuremberg, Bavaria",
"Jun 7, 2026 - Nürburg, RP",
"Jun 9, 2026 - Leipzig, Saxony",
"Jun 10–14, 2026 - Czechia",
"Jun 12–14, 2026 - Switzerland",
"Jun 12–13, 2026 - Austria",
"Jun 15, 2026 - Hamburg",
"Jun 16, 2026 - Cologne",
"Jun 19, 2026 - Belgium",
"Jun 22, 2026 - Berlin",
"Jun 23, 2026 - Warsaw",
"Jun 25, 2026 - Budapest",
"Jun 27, 2026 - Romania",
"Jun 29, 2026 - Bulgaria",
"Jun 30, 2026 - Serbia",
"Jul 2, 2026 - Zagreb",
"Jul 3, 2026 - Milan",
"Jul 5, 2026 - Barcelona",
"Jul 7, 2026 - Paris",
"Jul 8, 2026 - Amsterdam",
"Jul 10, 2026 - Birmingham",
"Jul 11, 2026 - Glasgow",
"Jul 13, 2026 - Belfast",
"Jul 14, 2026 - Dublin",
"Jul 16, 2026 - Manchester",
"Jul 17, 2026 - London",
"Sep 2–Oct 24, 2026 - USA & Canada Tour"
];

const tourGrid=document.getElementById("tour-grid");

tourDates.forEach(date=>{
  tourGrid.innerHTML+=`
  <div class="card">
    <div class="card-content">
      <h3>${date}</h3>
      <button class="btn-primary" onclick="window.open('https://vip-celebrity-fan-page.github.io/Breaking-Benjamin-tickets/')">Tickets</button>
    </div>
  </div>`;
});

/* GSAP */
gsap.from(".hero-overlay h1",{y:100,opacity:0,duration:1});
gsap.utils.toArray(".card").forEach(card=>{
  gsap.from(card,{
    scrollTrigger:card,
    y:50,
    opacity:0,
    duration:.8
  });
});

updateCart();

</script>
</body>
</html>
